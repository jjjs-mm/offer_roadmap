<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>mini-agent</title>
    <style>
      :root {
        color: #172033;
        background: #f5f7fb;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
      }

      .app {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 760px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px;
      }

      header h1 {
        margin: 0;
      }

      header p {
        color: #637083;
        margin: 6px 0 0;
      }

      #messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        border-radius: 12px;
        line-height: 1.6;
        max-width: 85%;
        padding: 12px 16px;
        white-space: pre-wrap;
      }

      .assistant {
        align-self: flex-start;
        background: #e8edf7;
      }

      .user {
        align-self: flex-end;
        background: #2864dc;
        color: white;
      }

      #chat-form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      #knowledge-document-id {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #c9d2e3;
        border-radius: 10px;
        font: inherit;
        padding: 10px 12px;
      }

      #question {
        border: 1px solid #c9d2e3;
        border-radius: 10px;
        flex: 1;
        font: inherit;
        min-height: 48px;
        padding: 10px 12px;
        resize: vertical;
      }

      button {
        background: #2864dc;
        border: 0;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font: inherit;
        padding: 0 20px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #status {
        color: #637083;
        font-size: 14px;
        margin: 0;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main class="app">     
      <header>
        <h1>mini-agent</h1>
        <p>支持流式回答与 MCP 工具调用。</p>
        <button
            id="new-conversation-button"
            type="button"
        >
         新对话
        </button>
      </header>

      <section
        id="messages"
        aria-live="polite"
      >
        <div class="message assistant">
          你好！有什么可以帮你的吗？
        </div>
      </section>

      <form id="chat-form">
        <input
           id="knowledge-document-id"
           type="text"
           placeholder="知识文档 ID（可选）"
           autocomplete="off"
        >
        <textarea
          id="question"
          placeholder="输入问题，例如：3 * (7 + 2) 等于多少？"
          required
        ></textarea>
        <button
          id="send-button"
          type="submit"
        >
          发送
        </button>
      </form>
      <p
        id="status"
        role="status"
      ></p>
    </main>
        <script>
      const form = document.querySelector("#chat-form");
      const questionInput = document.querySelector("#question");
      const knowledgeDocumentIdInput = document.querySelector(
        "#knowledge-document-id",
);
      const sendButton = document.querySelector("#send-button");
      const newConversationButton = document.querySelector(
             "#new-conversation-button",
      );
      const messages = document.querySelector("#messages");
      const status = document.querySelector("#status");
      let conversationId = crypto.randomUUID();

      function appendMessage(role, content) {
        const message = document.createElement("div");
        message.className = `message ${role}`;
        message.textContent = content;
        messages.append(message);
        message.scrollIntoView({ block: "end" });
        return message;
      }

      function updateStatus(content) {
        status.textContent = content;
      }

      async function startNewConversation() {
         newConversationButton.disabled = true;

         try {
           const response = await fetch(
               `/conversations/${encodeURIComponent(conversationId)}`,
             {
                method: "DELETE",
             },
            );

          if (!response.ok) {
             throw new Error(`清空会话失败：${response.status}`);
            }

          conversationId = crypto.randomUUID();
          messages.replaceChildren();

          appendMessage(
             "assistant",
             "你好！有什么可以帮你的吗？",
            );
         updateStatus("已开始新对话。");
       } catch (error) {
         updateStatus(`错误：${error.message}`);
       } finally {
         newConversationButton.disabled = false;
      }
      }

      function parseEvent(rawEvent) {
        const lines = rawEvent.split("\n");
        let eventType = "";
        let data = "";

        for (const line of lines) {
          if (line.startsWith("event:")) {
            eventType = line.slice(6).trim();
          }

          if (line.startsWith("data:")) {
            data += line.slice(5).trim();
          }
        }

        if (!eventType || !data) {
          return null;
        }

        return {
          type: eventType,
          data: JSON.parse(data),
        };
      }

      async function readStream(question) {
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            question,
            conversation_id: conversationId,
            knowledge_document_id: knowledgeDocumentIdInput.value.trim() || null,
          }),
        });

        if (!response.ok || !response.body) {
          throw new Error(`请求失败：${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let assistantMessage = null;
        let answerTextNode = null;

        while (true) {
          const { value, done } = await reader.read();

          if (value) {
            buffer += decoder.decode(value, {
              stream: !done,
            });
            buffer = buffer.replaceAll("\r\n", "\n");
          }

          let separatorIndex = buffer.indexOf("\n\n");

          while (separatorIndex !== -1) {
            const rawEvent = buffer.slice(0, separatorIndex);
            buffer = buffer.slice(separatorIndex + 2);

            const event = parseEvent(rawEvent);

            if (event?.type === "trace") {
              updateStatus(
                `请求已接收（Trace：${event.data.trace_id}）`,
              );
            } else if (event?.type === "content") {
              if (!assistantMessage) {
                assistantMessage = appendMessage(
                  "assistant",
                  "",
                );
              }

              if (!answerTextNode) {
                answerTextNode = document.createTextNode("");
                assistantMessage.append(answerTextNode);
              }
              answerTextNode.textContent += event.data.content;
              assistantMessage.scrollIntoView({
                block: "end",
              });
            } else if (event?.type === "citation") {
                if (!assistantMessage) {
                   assistantMessage = appendMessage("assistant", "");
                }

                const citation = document.createElement("div");
                const link = document.createElement("a");
                link.href = `/knowledge/documents/${encodeURIComponent(event.data.document_id)}`;
                const location = event.data.page_number
                    ? `第 ${event.data.page_number} 页，第 ${event.data.chunk_index + 1} 块`
                    : `第 ${event.data.chunk_index + 1} 块`;
                link.textContent = `来源：${event.data.source_name}（${location}）`;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                citation.append(link);
                assistantMessage.append(citation);
            } else if (event?.type === "tool_start") {
              updateStatus(
                `正在调用工具：${event.data.name}`,
              );
            } else if (event?.type === "tool_end") {
              updateStatus(
                `工具完成：${event.data.name}`,
              );
            } else if (event?.type === "retry") {
              updateStatus("网络波动，正在重试……");
            } else if (event?.type === "evidence_check") {
              const requiredFields = (
                event.data.required_evidence_fields || []
              ).join("、");
              updateStatus(
                event.data.sufficient
                  ? "证据检查通过，正在生成回答……"
                  : requiredFields
                    ? `证据不足（需要：${requiredFields}），已停止模型生成。`
                    : "证据不足，已停止模型生成。",
              );
            } else if (event?.type === "error") {
              updateStatus(`错误：${event.data.message}`);
            } else if (event?.type === "done") {
              updateStatus("回答完成。");
            }

            separatorIndex = buffer.indexOf("\n\n");
          }

          if (done) {
            break;
          }
        }
      }

      newConversationButton.addEventListener(
         "click",
         startNewConversation,
      );

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const question = questionInput.value.trim();

        if (!question) {
          return;
        }

        appendMessage("user", question);
        questionInput.value = "";
        questionInput.disabled = true;
        sendButton.disabled = true;
        newConversationButton.disabled = true;
        updateStatus("正在连接 Agent……");

        try {
          await readStream(question);
        } catch (error) {
          updateStatus(`错误：${error.message}`);
        } finally {
          questionInput.disabled = false;
          sendButton.disabled = false;
          newConversationButton.disabled = false;
          questionInput.focus();
        }
      });
    </script>
  </body>
</html>
