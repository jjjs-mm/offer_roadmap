[project]
name = "code-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jjjs", email = "ssjjj416@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "pydantic>=2.13.5",
]

